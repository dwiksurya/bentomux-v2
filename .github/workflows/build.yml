name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  verify:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: '*.dmg'
          - os: ubuntu-22.04
            artifact: '*.AppImage'
          - os: windows-latest
            artifact: '*.msi'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "$V"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: npm run test:backend
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run tauri -- build --target universal-apple-darwin
            echo "BUNDLE_DIR=src-tauri/target/universal-apple-darwin/release/bundle" >> "$GITHUB_ENV"
          else
            npm run tauri -- build
            echo "BUNDLE_DIR=src-tauri/target/release/bundle" >> "$GITHUB_ENV"
          fi

      - name: Validate packaged resources and sizes
        run: node scripts/verify-bundle.mjs "$BUNDLE_DIR"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: bentomux-${{ runner.os }}
          path: |
            ${{ env.BUNDLE_DIR }}/**/*.dmg
            ${{ env.BUNDLE_DIR }}/**/*.AppImage
            ${{ env.BUNDLE_DIR }}/**/*.msi
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          find "$BUNDLE_DIR" -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.msi' \) \
            -exec gh release upload "$GITHUB_REF_NAME" {} --clobber \;
