name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: '*.dmg'
          - os: ubuntu-22.04
            artifact: '*.AppImage'
          - os: windows-latest
            artifact: '*.msi'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build

      - name: Validate packaged resources and sizes
        run: node scripts/verify-bundle.mjs src-tauri/target/release/bundle

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: bentomux-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
