<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bentomux — approval</title>
<style>
  html, body {
    margin: 0;
    background: transparent;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 16px;
    clip-path: inset(0 round 16px);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  @keyframes island-in {
    from { opacity: 0; transform: translateY(-14px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }
  .island {
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    background: var(--bg, rgba(18, 18, 22, .96));
    border: 1px solid var(--border, rgba(255, 255, 255, .18));
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: var(--shadow, 0 12px 40px rgba(0, 0, 0, .45));
    font-size: 12px;
    color: var(--ink, #1f2328);
    animation: island-in .22s cubic-bezier(.2, .9, .25, 1.15) both;
    transition: background .15s ease;
  }
  .island:hover { background: var(--bg-hover, #ffffff); }
  .head { display: flex; gap: 8px; align-items: baseline; flex: 0 0 auto; }
  .agent { font-weight: 600; }
  .where { color: var(--ink2, #57606a); font-size: 11px; }
  .tool {
    color: var(--ink2, #57606a);
    font-size: 10px;
    letter-spacing: .05em;
    text-transform: uppercase;
    margin-top: 8px;
    flex: 0 0 auto;
  }
  .sum {
    font: 11.5px/1.6 Consolas, monospace;
    background: var(--sum-bg, rgba(0, 0, 0, .055));
    border-radius: 8px;
    padding: 7px 9px;
    margin-top: 5px;
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
    overflow: auto;
  }
  .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; flex: 0 0 auto; }
  button {
    border: 0;
    border-radius: 8px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    background: transparent;
    color: var(--ink, #1f2328);
  }
  button:hover { background: var(--btn-hover, rgba(0, 0, 0, .08)); }
  .approve { background: #2563eb; color: #fff; }
  .approve:hover { background: #1d4ed8; }
  button { user-select: none; }
</style>
</head>
<body>
<div class="island" id="island">
  <div class="head"><span class="agent">Claude Code</span><span class="where" id="where"></span></div>
  <div class="tool" id="tool"></div>
  <div class="sum" id="sum"></div>
  <div class="row">
    <button id="jump">Jump</button>
    <button id="deny">Deny</button>
    <button id="approve" class="approve">Approve</button>
  </div>
</div>
<script type="module" src="/approval.ts"></script>
</body>
</html>
